<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BioScan - Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#00531a",
                        "outline": "#916e6f",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d9dade",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e8e8ed",
                        "secondary-container": "#64fd7d",
                        "tertiary": "#0058bc",
                        "on-secondary-fixed": "#002106",
                        "on-primary-fixed": "#40000c",
                        "background": "#f9f9fe",
                        "on-surface-variant": "#5d3f40",
                        "surface-tint": "#be0036",
                        "secondary-fixed": "#6cff82",
                        "on-tertiary-container": "#fefcff",
                        "outline-variant": "#e6bcbd",
                        "on-surface": "#1a1c1f",
                        "surface-container": "#ededf2",
                        "on-primary-fixed-variant": "#920027",
                        "inverse-primary": "#ffb3b5",
                        "surface-bright": "#f9f9fe",
                        "tertiary-fixed": "#d8e2ff",
                        "primary-fixed-dim": "#ffb3b5",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#fffbff",
                        "on-tertiary-fixed-variant": "#004493",
                        "secondary-fixed-dim": "#47e266",
                        "surface-variant": "#e2e2e7",
                        "tertiary-container": "#0070eb",
                        "surface-container-highest": "#e2e2e7",
                        "on-background": "#1a1c1f",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2e3034",
                        "surface-container-low": "#f3f3f8",
                        "primary": "#ba0034",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "secondary": "#006e26",
                        "primary-container": "#e51245",
                        "inverse-on-surface": "#f0f0f5",
                        "on-tertiary-fixed": "#001a41",
                        "surface": "#f9f9fe",
                        "on-secondary-container": "#007328",
                        "primary-fixed": "#ffdada"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .tactile-glow {
            box-shadow: 0 0 30px 5px rgba(186, 0, 52, 0.4);
        }
        .tactile-inner {
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.8), inset -2px -2px 0px rgba(26, 28, 31, 0.05);
        }
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(230, 188, 189, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body h-full overflow-hidden relative selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 backdrop-blur-md bg-white/90 dark:bg-slate-950/90 shadow-[inset_0_-1px_0_rgba(230,188,189,0.15)] shadow-[0_10px_30px_-10px_rgba(26,28,31,0.08)]">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container transition-colors text-slate-400">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
<h1 class="text-xl font-black text-slate-900 dark:text-slate-50 tracking-tighter">BioScan</h1>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container transition-colors text-slate-400">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
</header>
<!-- Main Canvas (Camera View Placeholder) -->
<main class="h-full w-full relative bg-surface-dim pt-16 pb-[120px] flex items-center justify-center">
<!-- Background Camera Image -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center z-0" data-alt="close up of a grocery store shelf with fresh organic vegetables brightly lit with depth of field blur" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDNFG2wIzbjTCj6I0UysKt6oUKKkTpnXD7-KSHUny8llPrDVOUfDsmnZvCAjtlu_veqEevDWjwKAhqu1PsH36kKx3Yh-Gno3UhrdQdW4gri5qVH_N6N7rzj0hGjcj7AYkIAzYzZ4Ot_4udjtwZi3-qKesIpXAgQOMPW-RomRRPrpbSq2JoREUrd5JF8FVJ_7f981TxQRAUpM0u7qk7tlTNojF9430cQG3UBCq7R-B9xe5_N2FTRpQN0JAJrll-u93qu1vWh5cDtq5A');"></div>
<!-- Dark Overlay for Contrast -->
<div class="absolute inset-0 w-full h-full bg-black/40 z-0"></div>
<!-- Scanning Reticle (Skeuomorphic) -->
<div class="relative z-10 w-72 h-72 border-2 border-primary/50 rounded-lg flex items-center justify-center tactile-glow">
<!-- Corner Markers -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Scanning Line -->
<div class="w-full h-0.5 bg-primary absolute top-1/2 left-0 tactile-glow"></div>
<p class="text-white font-label uppercase tracking-widest text-sm mt-40 opacity-80">Align barcode within frame</p>
</div>
<!-- Controls Area -->
<div class="absolute bottom-32 w-full px-6 flex justify-between items-end z-20">
<!-- Flash Toggle -->
<button class="w-14 h-14 rounded-full glass-panel flex items-center justify-center text-on-surface tactile-inner hover:bg-white/80 transition-colors shadow-[0_10px_30px_-10px_rgba(26,28,31,0.2)]">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
<!-- Manual Input CTA -->
<button class="px-6 py-4 rounded-full bg-surface-container-lowest flex items-center gap-2 text-on-surface font-headline font-semibold tactile-inner shadow-[0_10px_30px_-10px_rgba(26,28,31,0.2)] hover:bg-surface transition-colors">
<span class="material-symbols-outlined" data-icon="keyboard">keyboard</span>
                Manual Entry
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 backdrop-blur-3xl bg-white/70 dark:bg-slate-900/70 border-t border-white/20 dark:border-slate-800/20 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] rounded-t-[2.5rem] md:hidden">
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Home</span>
</button>
<!-- Active State -->
<button class="flex flex-col items-center justify-center bg-gradient-to-br from-[#ba0034] to-[#e51245] text-white rounded-full px-5 py-2 shadow-[0_4px_15px_rgba(186,0,52,0.3)] scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="qr_code_scanner" data-weight="fill" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Scan</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="restaurant">restaurant</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Nutrition</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Profile</span>
</button>
</nav>
</body></html>
