<style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f9fe; }
        .ambient-shadow { box-shadow: 0 10px 30px -10px rgba(26,28,31,0.08); }
        .inner-tactile { box-shadow: inset 2px 2px 0px rgba(255,255,255,0.8), inset -2px -2px 0px rgba(26,28,31,0.05); }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(230,188,189,0.15); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface antialiased min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 backdrop-blur-md bg-white/90 dark:bg-slate-950/90 shadow-[inset_0_-1px_0_rgba(230,188,189,0.15)] shadow-[0_10px_30px_-10px_rgba(26,28,31,0.08)]">
<button class="hover:opacity-80 transition-opacity Active: scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-[#FF2D55] dark:text-[#FF2D55]">account_circle</span>
</button>
<h1 class="text-xl font-black text-slate-900 dark:text-slate-50 tracking-tighter font-['Inter']">BioScan</h1>
<button class="hover:opacity-80 transition-opacity Active: scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-[#FF2D55] dark:text-[#FF2D55]">history</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-24 px-4 max-w-lg mx-auto">
<!-- Profile Header -->
<section class="flex flex-col items-center mb-10">
<div class="relative w-32 h-32 mb-4 rounded-full bg-surface-container-low ambient-shadow inner-tactile flex items-center justify-center p-2">
<img alt="Profile avatar" class="w-full h-full object-cover rounded-full" data-alt="close up portrait of a confident young woman with clear skin, natural lighting, soft background focus" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2PDhZzR3EWMcoC08iCov-2bYef-TCuQEuGJVew5-A1BEHvwM7b4OJATL3dvIOEMG61rZFioyn0o4m01z6LXe216h81iKnNmt1n0ze9PCCC7Ojg7W_xIpJZ3Y6Q3xc-Gg8lmhxU_A3qBXuneDxf2eS8_YaC9f0Td0RW1VZ9z3PB1I-dDFEyoNiEfAyaPM58uhYDfmT1F_YIXFj4J7WbukYzWWMrzJqmerSSwRMKwb2CsEksmSCMGc3JW8MwNqWYYt7EsLAM3i-120"/>
<button class="absolute bottom-0 right-0 w-10 h-10 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full flex items-center justify-center ambient-shadow border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-sm">edit</span>
</button>
</div>
<h2 class="text-2xl font-bold tracking-tight text-on-surface font-headline">Elena Rostova</h2>
<p class="text-on-surface-variant font-body text-sm mt-1">elena.r@example.com</p>
</section>
<!-- Stats Bento -->
<section class="grid grid-cols-2 gap-4 mb-8">
<div class="bg-surface-container-lowest rounded-lg p-5 ambient-shadow inner-tactile flex flex-col justify-between h-32">
<span class="material-symbols-outlined text-secondary mb-2" style="font-variation-settings: 'FILL' 1;">eco</span>
<div>
<h3 class="text-on-surface-variant font-label text-xs uppercase tracking-widest font-semibold mb-1">Health Score</h3>
<p class="text-3xl font-black tracking-tight text-secondary font-headline">94<span class="text-lg text-secondary/60">%</span></p>
</div>
</div>
<div class="bg-surface-container-lowest rounded-lg p-5 ambient-shadow inner-tactile flex flex-col justify-between h-32">
<span class="material-symbols-outlined text-primary mb-2" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<div>
<h3 class="text-on-surface-variant font-label text-xs uppercase tracking-widest font-semibold mb-1">Current Streak</h3>
<p class="text-3xl font-black tracking-tight text-primary font-headline">12<span class="text-lg text-primary/60">d</span></p>
</div>
</div>
</section>
<!-- Settings Cards -->
<section class="space-y-6">
<!-- Dietary Preferences -->
<div class="bg-surface-container-low rounded-lg p-1">
<div class="bg-surface-container-lowest rounded-[1.75rem] p-6 ambient-shadow inner-tactile">
<div class="flex items-center gap-3 mb-6">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-tertiary-container">restaurant_menu</span>
</div>
<h3 class="text-lg font-bold font-headline">Dietary Preferences</h3>
</div>
<div class="space-y-4">
<div class="flex items-center justify-between">
<span class="font-body text-on-surface">Vegetarian</span>
<button class="w-12 h-6 rounded-full bg-secondary-container relative transition-colors duration-300">
<div class="absolute right-1 top-1 w-4 h-4 bg-on-secondary-container rounded-full inner-tactile"></div>
</button>
</div>
<div class="flex items-center justify-between">
<span class="font-body text-on-surface">Gluten-Free</span>
<button class="w-12 h-6 rounded-full bg-surface-variant relative transition-colors duration-300">
<div class="absolute left-1 top-1 w-4 h-4 bg-on-surface-variant rounded-full inner-tactile"></div>
</button>
</div>
</div>
</div>
</div>
<!-- Allergies -->
<div class="bg-surface-container-low rounded-lg p-1">
<div class="bg-surface-container-lowest rounded-[1.75rem] p-6 ambient-shadow inner-tactile">
<div class="flex items-center gap-3 mb-6">
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-error-container">warning</span>
</div>
<h3 class="text-lg font-bold font-headline">Allergies &amp; Sensitivities</h3>
</div>
<div class="flex flex-wrap gap-2">
<span class="px-4 py-2 bg-surface-container-high text-on-surface rounded-full font-label text-sm font-medium inner-tactile">Peanuts</span>
<span class="px-4 py-2 bg-surface-container-high text-on-surface rounded-full font-label text-sm font-medium inner-tactile">Shellfish</span>
<button class="px-4 py-2 bg-surface border border-outline-variant/30 text-on-surface-variant rounded-full font-label text-sm font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-sm">add</span> Add New
                        </button>
</div>
</div>
</div>
<button class="w-full py-4 mt-8 bg-surface-container-lowest text-error font-bold font-headline rounded-full ambient-shadow inner-tactile border border-outline-variant/15">
                Sign Out
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 backdrop-blur-3xl bg-white/70 dark:bg-slate-900/70 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] border-t border-white/20 dark:border-slate-800/20 rounded-t-[2.5rem]">
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1">qr_code_scanner</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Scan</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1">restaurant</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Nutrition</span>
</button>
<button class="flex flex-col items-center justify-center bg-gradient-to-br from-[#ba0034] to-[#e51245] text-white rounded-full px-5 py-2 shadow-[0_4px_15px_rgba(186,0,52,0.3)] Active: scale-90 duration-300 ease-out hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Profile</span>
</button>
</nav>
</body></html>
