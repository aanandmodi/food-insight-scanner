<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BioScan - Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-highest": "#e2e2e7",
                      "on-error": "#ffffff",
                      "background": "#f9f9fe",
                      "surface-variant": "#e2e2e7",
                      "on-surface": "#1a1c1f",
                      "secondary-container": "#64fd7d",
                      "tertiary": "#0058bc",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary": "#ffffff",
                      "surface-container-high": "#e8e8ed",
                      "on-surface-variant": "#5d3f40",
                      "on-secondary-fixed": "#002106",
                      "on-primary-fixed-variant": "#920027",
                      "primary-fixed": "#ffdada",
                      "primary": "#ba0034",
                      "error-container": "#ffdad6",
                      "on-primary-container": "#fffbff",
                      "outline": "#916e6f",
                      "secondary-fixed-dim": "#47e266",
                      "surface-dim": "#d9dade",
                      "error": "#ba1a1a",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#2e3034",
                      "surface": "#f9f9fe",
                      "secondary": "#006e26",
                      "surface-tint": "#be0036",
                      "primary-container": "#e51245",
                      "surface-container": "#ededf2",
                      "on-error-container": "#93000a",
                      "on-background": "#1a1c1f",
                      "on-primary-fixed": "#40000c",
                      "on-tertiary": "#ffffff",
                      "tertiary-fixed-dim": "#adc6ff",
                      "on-tertiary-fixed-variant": "#004493",
                      "tertiary-fixed": "#d8e2ff",
                      "on-tertiary-container": "#fefcff",
                      "inverse-primary": "#ffb3b5",
                      "tertiary-container": "#0070eb",
                      "on-tertiary-fixed": "#001a41",
                      "on-secondary-container": "#007328",
                      "outline-variant": "#e6bcbd",
                      "primary-fixed-dim": "#ffb3b5",
                      "secondary-fixed": "#6cff82",
                      "on-secondary-fixed-variant": "#00531a",
                      "inverse-on-surface": "#f0f0f5",
                      "surface-bright": "#f9f9fe",
                      "surface-container-low": "#f3f3f8"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Inter"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9fe;
        }
        
        /* Skeuomorphic/Tactile Helpers */
        .ambient-shadow {
            box-shadow: 0 10px 30px -10px rgba(26,28,31,0.08);
        }
        
        .tactile-card {
            box-shadow: 0 15px 30px -5px rgba(26, 28, 31, 0.05), inset 1px 1px 2px rgba(255,255,255,0.8), inset -1px -1px 2px rgba(26, 28, 31, 0.02);
        }
        
        .primary-btn-gradient {
            background: linear-gradient(135deg, #ba0034 0%, #e51245 100%);
            box-shadow: 0 10px 20px -5px rgba(186, 0, 52, 0.3), inset 1px 1px 2px rgba(255,255,255,0.3);
        }

        .secondary-btn-tactile {
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.8), inset -2px -2px 5px rgba(26, 28, 31, 0.05);
        }
        
        .glass-panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen pb-32 pt-20">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 backdrop-blur-md bg-white/90 shadow-[inset_0_-1px_0_rgba(230,188,189,0.15)] shadow-[0_10px_30px_-10px_rgba(26,28,31,0.08)]">
<button class="text-slate-400 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[28px]" data-icon="account_circle">account_circle</span>
</button>
<h1 class="text-xl font-black text-slate-900 tracking-tighter">BioScan</h1>
<button class="text-slate-400 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[28px]" data-icon="history">history</span>
</button>
</header>
<main class="px-6 max-w-md mx-auto space-y-8">
<!-- Personalized Greeting -->
<section class="mt-4">
<h2 class="text-[32px] font-bold tracking-tight leading-tight text-on-surface">Good morning,<br/>Alex.</h2>
<p class="text-on-surface-variant font-medium mt-2 text-lg">Ready to fuel your day?</p>
</section>
<!-- Main Nutrition Donut Card (Tactile) -->
<section class="bg-surface-container-lowest rounded-[2rem] p-6 tactile-card flex flex-col items-center justify-center relative overflow-hidden">
<!-- Decorative blur behind chart -->
<div class="absolute w-48 h-48 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="w-full flex justify-between items-end mb-6">
<h3 class="text-sm uppercase tracking-widest font-semibold text-on-surface-variant">Daily Intake</h3>
<span class="text-xs font-semibold text-primary">Goal: 2,000 kcal</span>
</div>
<!-- Refined Elegant Donut Chart -->
<div class="relative w-44 h-44 flex items-center justify-center mb-8 rounded-full shadow-[inset_2px_2px_5px_rgba(255,255,255,0.8),inset_-2px_-2px_5px_rgba(26,28,31,0.03)] p-2">
<!-- SVG Chart -->
<svg class="w-full h-full transform -rotate-90 drop-shadow-md" viewbox="0 0 100 100">
<defs>
<lineargradient id="ring-grad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ba0034"></stop>
<stop offset="100%" stop-color="#e51245"></stop>
</lineargradient>
</defs>
<circle cx="50" cy="50" fill="none" r="42" stroke="#f3f3f8" stroke-width="8"></circle>
<circle cx="50" cy="50" fill="none" r="42" stroke="url(#ring-grad)" stroke-dasharray="263.89" stroke-dashoffset="75" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Center Stats -->
<div class="absolute flex flex-col items-center justify-center">
<span class="text-4xl font-black tracking-tighter text-on-surface drop-shadow-sm">1,420</span>
<span class="text-[10px] uppercase tracking-[0.2em] font-bold text-on-surface-variant mt-1">Kcal</span>
</div>
</div>
<!-- Macronutrient Progress Bars -->
<div class="w-full flex flex-col gap-4">
<!-- Carbs -->
<div>
<div class="flex justify-between text-xs font-bold mb-2">
<div class="flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-primary-container shadow-sm"></div>
<span class="text-on-surface">Carbs</span>
</div>
<span class="text-on-surface-variant font-medium">150g / 200g</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden shadow-inner">
<div class="h-full bg-primary-container rounded-full shadow-md" style="width: 75%;"></div>
</div>
</div>
<!-- Protein -->
<div>
<div class="flex justify-between text-xs font-bold mb-2">
<div class="flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-secondary shadow-sm"></div>
<span class="text-on-surface">Protein</span>
</div>
<span class="text-on-surface-variant font-medium">80g / 120g</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden shadow-inner">
<div class="h-full bg-secondary rounded-full shadow-md" style="width: 66%;"></div>
</div>
</div>
<!-- Fat -->
<div>
<div class="flex justify-between text-xs font-bold mb-2">
<div class="flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-slate-400 shadow-sm"></div>
<span class="text-on-surface">Fat</span>
</div>
<span class="text-on-surface-variant font-medium">45g / 65g</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden shadow-inner">
<div class="h-full bg-slate-400 rounded-full shadow-md" style="width: 69%;"></div>
</div>
</div>
</div>
</section>
<!-- Quick Actions (Asymmetric Bento) -->
<section class="grid grid-cols-2 gap-4">
<!-- Scan Action -->
<button class="bg-surface-container-lowest rounded-lg p-5 tactile-card flex flex-col items-start gap-4 hover:scale-[0.98] transition-transform">
<div class="w-12 h-12 rounded-full primary-btn-gradient flex items-center justify-center text-on-primary shadow-lg">
<span class="material-symbols-outlined" data-icon="qr_code_scanner" data-weight="fill" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
<div class="text-left">
<h4 class="font-bold text-on-surface">Scan Item</h4>
<p class="text-xs text-on-surface-variant mt-1">Check ingredients</p>
</div>
</button>
<!-- Log Meal Action -->
<button class="bg-surface-container-low rounded-lg p-5 secondary-btn-tactile flex flex-col items-start gap-4 hover:scale-[0.98] transition-transform">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="restaurant" data-weight="fill" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="text-left">
<h4 class="font-bold text-on-surface">Log Meal</h4>
<p class="text-xs text-on-surface-variant mt-1">Add manually</p>
</div>
</button>
</section>
<!-- Recent Scans List -->
<section class="space-y-4">
<h3 class="text-sm uppercase tracking-widest font-semibold text-on-surface-variant ml-2">Recent Scans</h3>
<!-- Scan Item 1 (Safe) -->
<div class="bg-surface-container-lowest rounded-lg p-4 tactile-card flex items-center gap-4">
<div class="w-14 h-14 rounded-lg overflow-hidden bg-surface-container flex-shrink-0">
<img alt="Oat Milk" class="w-full h-full object-cover" data-alt="close-up of a carton of premium oat milk on a clean kitchen counter with soft morning light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtyNJLTnJ3cuy77etB4pr_jNeDHxE0HoC_qB-sQeoggcWG-V8LQvZrW9JO80_aAbXkKfKR6F8tvCDKXjQmNr8MXWpP2CIdcCT6XxM69PWOwbVK88viqYBU7iQChhxKnuasuU5yRcJn4s3L8QfEJLaAUV3nDCjtBippksS0ZrgShvaP3OgYBYq0C_nv4OwjVlZVpTqkY3JkifhxtAuWk7IIFLBufZ3Di1N574YaS8e2m_eiuYeOdoPDEkRJlMopRkNXa1uOM4XFLic"/>
</div>
<div class="flex-grow">
<h4 class="font-bold text-on-surface">Oat Milk</h4>
<p class="text-sm text-on-surface-variant">Oatly Barista Edition</p>
</div>
<div class="flex flex-col items-end gap-1">
<span class="material-symbols-outlined text-secondary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-xs font-semibold text-secondary">Safe</span>
</div>
</div>
<!-- Scan Item 2 (Warning) -->
<div class="bg-surface-container-lowest rounded-lg p-4 tactile-card flex items-center gap-4">
<div class="w-14 h-14 rounded-lg overflow-hidden bg-surface-container flex-shrink-0">
<img alt="Granola Bar" class="w-full h-full object-cover" data-alt="close up of a chocolate chip granola bar wrapper slightly opened on a white marble surface" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6NUz3EYW3xp06Hrgw8XdeDNcUuvL7YWEdow5LkMTZl5Sr2DAQenSGuyWjBcjfcdarKtonOFJKIW1snfzCHRmCAdAtOHMylcRWm4xEtrLFNeVhZIuihfGRP8a7WPFeI5JCmlHdrnTQc1eKa1B_XD9f5V1KVQ1tN3OW46x2oyq7iDpPsXxmSIa5Gcyyz-spm6kPtr0tW0sUxoGxPA6ZL795x9vfjNw60Bx_yzmMsxjrpGiLQ64OmS3xFzLxxQgxD6xWGI_KtdcPqN8"/>
</div>
<div class="flex-grow">
<h4 class="font-bold text-on-surface">Granola Bar</h4>
<p class="text-sm text-on-surface-variant">Nature Valley</p>
</div>
<div class="flex flex-col items-end gap-1">
<span class="material-symbols-outlined text-error" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="text-xs font-semibold text-error">High Sugar</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 backdrop-blur-3xl bg-white/70 border-t border-white/20 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)] md:hidden glass-panel">
<!-- Active Tab: Home -->
<button class="flex flex-col items-center justify-center bg-gradient-to-br from-[#ba0034] to-[#e51245] text-white rounded-full px-5 py-2 shadow-[0_4px_15px_rgba(186,0,52,0.3)] scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Home</span>
</button>
<!-- Inactive Tab: Scan -->
<button class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Scan</span>
</button>
<!-- Inactive Tab: Nutrition -->
<button class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="restaurant">restaurant</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Nutrition</span>
</button>
<!-- Inactive Tab: Profile -->
<button class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-[#FF2D55] transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-widest">Profile</span>
</button>
</nav>
</body></html>
