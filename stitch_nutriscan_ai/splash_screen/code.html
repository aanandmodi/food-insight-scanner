<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BioScan - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#00531a",
                        "outline": "#916e6f",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d9dade",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e8e8ed",
                        "secondary-container": "#64fd7d",
                        "tertiary": "#0058bc",
                        "on-secondary-fixed": "#002106",
                        "on-primary-fixed": "#40000c",
                        "background": "#f9f9fe",
                        "on-surface-variant": "#5d3f40",
                        "surface-tint": "#be0036",
                        "secondary-fixed": "#6cff82",
                        "on-tertiary-container": "#fefcff",
                        "outline-variant": "#e6bcbd",
                        "on-surface": "#1a1c1f",
                        "surface-container": "#ededf2",
                        "on-primary-fixed-variant": "#920027",
                        "inverse-primary": "#ffb3b5",
                        "surface-bright": "#f9f9fe",
                        "tertiary-fixed": "#d8e2ff",
                        "primary-fixed-dim": "#ffb3b5",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#fffbff",
                        "on-tertiary-fixed-variant": "#004493",
                        "secondary-fixed-dim": "#47e266",
                        "surface-variant": "#e2e2e7",
                        "tertiary-container": "#0070eb",
                        "surface-container-highest": "#e2e2e7",
                        "on-background": "#1a1c1f",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2e3034",
                        "surface-container-low": "#f3f3f8",
                        "primary": "#ba0034",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "secondary": "#006e26",
                        "primary-container": "#e51245",
                        "inverse-on-surface": "#f0f0f5",
                        "on-tertiary-fixed": "#001a41",
                        "surface": "#f9f9fe",
                        "on-secondary-container": "#007328",
                        "primary-fixed": "#ffdada"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .glass-overlay {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(230, 188, 189, 0.15);
        }
        .ambient-shadow {
            box-shadow: 0 10px 30px -10px rgba(26, 28, 31, 0.08);
        }
        .pill-button-primary {
            background: linear-gradient(135deg, #ba0034, #e51245);
        }
        .tactile-pressed {
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.8), inset -2px -2px 4px rgba(26, 28, 31, 0.05);
        }
        .tactile-lifted {
            box-shadow: -2px -2px 4px rgba(255, 255, 255, 0.8), 2px 2px 4px rgba(26, 28, 31, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface antialiased h-screen w-full flex items-center justify-center relative overflow-hidden">
<!-- Ambient Background Gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-bright via-surface-container-low to-surface-container opacity-80 pointer-events-none"></div>
<!-- Main Splah Container -->
<main class="relative z-10 flex flex-col items-center justify-center w-full max-w-md px-6">
<!-- Logo Section with Skeuomorphic Depth -->
<div class="mb-12 flex flex-col items-center">
<div class="w-32 h-32 rounded-[2rem] bg-surface-container-lowest flex items-center justify-center tactile-lifted mb-6">
<span class="material-symbols-outlined text-[4rem] text-primary" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
<h1 class="font-headline font-black text-4xl tracking-tighter text-on-surface mb-2">BioScan</h1>
<p class="font-body text-body-lg text-on-surface-variant tracking-wide">The Bio-Tactile Sanctuary</p>
</div>
<!-- Glassmorphism Progress Sequence -->
<div class="w-full glass-overlay rounded-lg p-6 ambient-shadow flex flex-col gap-4">
<!-- Step 1: Completed -->
<div class="flex items-center gap-4 bg-surface-container-lowest rounded-full p-2 pr-4 tactile-pressed">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-lg" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="flex-1">
<p class="font-label text-[11px] font-semibold uppercase tracking-widest text-on-surface">Initializing Sensors</p>
</div>
</div>
<!-- Step 2: Completed -->
<div class="flex items-center gap-4 bg-surface-container-lowest rounded-full p-2 pr-4 tactile-pressed">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-lg" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="flex-1">
<p class="font-label text-[11px] font-semibold uppercase tracking-widest text-on-surface">Calibrating Lens</p>
</div>
</div>
<!-- Step 3: Active Loading -->
<div class="flex items-center gap-4 bg-surface-container-lowest rounded-full p-2 pr-4 tactile-lifted border border-outline-variant/15 relative overflow-hidden">
<!-- Loading Progress Bar Background inside step -->
<div class="absolute left-0 top-0 bottom-0 w-[60%] pill-button-primary opacity-10 rounded-l-full"></div>
<div class="w-10 h-10 rounded-full pill-button-primary flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-on-primary text-lg" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
</div>
<div class="flex-1 relative z-10">
<p class="font-label text-[11px] font-semibold uppercase tracking-widest text-primary">Connecting Core</p>
</div>
</div>
<!-- Step 4: Pending -->
<div class="flex items-center gap-4 bg-transparent rounded-full p-2 pr-4 opacity-50">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center tactile-pressed">
<span class="material-symbols-outlined text-on-surface-variant text-lg" data-icon="cloud_done">cloud_done</span>
</div>
<div class="flex-1">
<p class="font-label text-[11px] font-semibold uppercase tracking-widest text-on-surface-variant">Syncing Profile</p>
</div>
</div>
</div>
</main>
<!-- Decorative Skeuomorphic Elements -->
<div class="absolute top-1/4 left-10 w-24 h-24 rounded-full bg-surface-container-lowest tactile-lifted opacity-50 pointer-events-none"></div>
<div class="absolute bottom-1/4 right-10 w-32 h-32 rounded-full bg-surface-container-lowest tactile-pressed opacity-50 pointer-events-none"></div>
</body></html>
