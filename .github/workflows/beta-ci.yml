name: Beta checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend
      - name: Analyze
        run: flutter analyze
        working-directory: frontend
      - name: Test
        run: flutter test
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build:edge
        working-directory: backend
      - run: git diff --exit-code -- supabase/functions/food-insight-api/backend.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check index.ts
        working-directory: supabase/functions/food-insight-api
      - run: deno test --allow-env --allow-read --allow-sys handler_test.ts runtime_test.ts
        working-directory: supabase/functions/food-insight-api

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - run: python tools/sync_legal_assets.py --check
      - run: python tools/check_signing_secrets.py
      - run: python tools/prepare_ci_android.py
      - run: flutter pub get
        working-directory: frontend
      - name: Release compilation and shrinking (ephemeral CI certificate; never distributed)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info
        working-directory: frontend
      - name: Verify 16 KB native library alignment
        run: python tools/check_android_alignment.py frontend/build/app/outputs/bundle/release/app-release.aab

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: security-tests
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test
        working-directory: security-tests
