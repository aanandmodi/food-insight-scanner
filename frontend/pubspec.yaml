version: 1.0.2+2003

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core Packages
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  cloud_functions: ^5.1.0
  firebase_auth: ^5.1.1
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3
  sqflite: ^2.3.0
  path: ^1.8.3
  connectivity_plus: ^6.0.3

  # UI & Responsive Design
  sizer: ^2.0.15
  google_fonts: ^6.2.1
