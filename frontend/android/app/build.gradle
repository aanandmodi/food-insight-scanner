plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigning = new Properties()
// Explicit opt-in lets device QA coexist with the user's installed app.
def dartDefines = (project.findProperty('dart-defines') ?: '').split(',').findAll { it }.collect {
    new String(it.decodeBase64(), 'UTF-8')
}
def qaBuild = dartDefines.contains('QA_BUILD=true')
def signingFile = rootProject.file('key.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace = "com.food_insight_scanner.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = qaBuild ? "com.food_insight_scanner.app.qa" : "com.food_insight_scanner.app"
        manifestPlaceholders.appLabel = qaBuild ? "Food Insight QA" : "Food Insight"
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(releaseSigning['storeFile'])
                storePassword releaseSigning['storePassword']
                keyAlias releaseSigning['keyAlias']
                keyPassword releaseSigning['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Keep iterative USB QA compatible with the separately signed QA app.
            if (qaBuild && signingFile.exists()) signingConfig = signingConfigs.release
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !signingFile.exists()) {
        throw new GradleException('Release builds require android/key.properties and the existing release keystore.')
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // Keep the scanner's current Dart API while updating its native libraries
    // to versions with 16 KB ELF alignment. Recheck when upgrading the plugin.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
}
