# Memory tuning for this build machine (~8 GB physical RAM).
#
# The previous -Xmx4096m reserved half of physical RAM for the Java heap, which
# left R8 (minify + obfuscation) unable to grow its *native* heap: the release
# build died with "Native memory allocation (malloc) failed ... Out of Memory
# Error (arena.cpp)". The JVM's own guidance for that crash is to DECREASE the
# Java heap, because the native allocations R8 makes live outside it.
#
# 2 GB is comfortably enough for R8 on this app while leaving headroom for the
# native heap, the Dart AOT compiler and the OS. Raise it only on a machine with
# noticeably more RAM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Keep peak memory bounded: one worker, no parallel project execution. This
# build has a single module, so parallelism bought nothing but contention.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Compile Kotlin inside the Gradle daemon rather than forking a second JVM —
# on a memory-constrained machine one heap is cheaper than two.
kotlin.compiler.execution.strategy=in-process
